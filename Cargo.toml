[package]
name = "yemilue"
version = "0.1.0"
edition = "2021"
authors = ["GRRN <research@grrn.io>"]
description = "Ultra-lightweight portable workstation task-capturing engine and real-time ML dataset pipeline"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation"
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.19"

[profile.release]
opt-level = "z"      # Optimize strictly for minimum binary size
lto = true           # Enable Link-Time Optimization
codegen-units = 1    # Single codegen unit for optimal compiler optimization
panic = "abort"      # Strip unwinding tables to drop binary size under 1.5MB
strip = true         # Automatically strip all debug symbols
